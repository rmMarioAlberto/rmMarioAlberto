name: SIGNAL ROOM // Contribution Snake

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: rmMarioAlberto
          outputs: |
            assets/snake.svg?color_snake=%2339FF88&color_dots=%230B0F0E,%23123B2E,%231F6B4F,%232DBF83,%2339FF88

      - name: Commit snake
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/snake.svg
          git commit -m "chore: update contribution snake" || exit 0
          git push
