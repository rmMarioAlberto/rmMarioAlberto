name: SIGNAL ROOM // Contribution Snake

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: rmMarioAlberto
          outputs: |
            assets/snake.svg?color_snake=%2339FF88&color_dots=%230B0F0E,%23123B2E,%231F6B4F,%232DBF83,%2339FF88
          github_token: ${{ secrets.GITHUB_TOKEN }}
