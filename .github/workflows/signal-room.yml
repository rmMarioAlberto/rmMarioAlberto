name: SIGNAL ROOM // Radar Telemetry

on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Generate radar SVG
        run: python3 scripts/generate_signal_room.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit radar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/signal-room.svg
          git commit -m "chore: update signal room telemetry" || exit 0
          git push
